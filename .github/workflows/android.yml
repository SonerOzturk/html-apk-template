name: APK uret (her pushta)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Bagimliliklari kur
        run: npm install

      - name: Web build (varsa)
        run: npm run build --if-present

      - name: Android platformunu ekle (yoksa)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Web dosyalarini senkronize et
        run: npx cap sync android

      - name: Debug APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APKyi yukle
        uses: actions/upload-artifact@v5
        with:
          name: oyun-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
